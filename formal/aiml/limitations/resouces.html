<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Resources</title>
    <link rel="stylesheet" href="/deck/deck.css" />
    <script src="/deck/deck.js" defer></script>
    <style>
      #video .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.4rem;
        max-width: 48rem;
        padding: 3rem 3.5rem;
        text-align: center;
      }

      #video .card a {
        font-family: var(--font-display);
        font-size: 2.4rem;
      }

      #video .card p {
        font-size: 1.35rem;
      }
    </style>
  </head>
  <body>
    <section class="slide cover">
      <span class="kicker">Limitations of AI</span>
      <h1>Resources</h1>
      <p>Further watching on the limits of AI.</p>
    </section>

    <section class="slide" id="video">
      <h2>Watch</h2>
      <div class="card step">
        <a href="https://www.youtube.com/watch?v=uyaaHVnUHOs">Video on YouTube →</a>
        <p class="muted">Linked rather than embedded: YouTube currently reports this video as private.</p>
      </div>
    </section>
  </body>
</html>
