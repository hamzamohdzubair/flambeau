<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Generalised Linear Models</title>
    <link rel="stylesheet" href="/deck/deck.css" />
    <script src="/deck/deck.js" defer></script>
    <style>
      #index {
        gap: 1.6rem;
      }

      #index .kicker {
        font-family: var(--font-mono);
        font-size: 0.8rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--cyan);
      }

      #index h1 {
        font-size: 4.4rem;
        text-align: center;
      }

      #index .intro {
        max-width: 40rem;
        text-align: center;
      }

      #index .group {
        display: grid;
        gap: 0.7rem;
        width: 100%;
      }

      #index .group h3 {
        font-size: 1.15rem;
        color: var(--text);
      }

      #index .tiles {
        grid-template-columns: none;
        grid-auto-flow: column;
        grid-auto-columns: minmax(0, 19rem);
        justify-content: center;
        gap: 1.4rem;
        width: 100%;
      }

      #index .tile {
        min-height: 11rem;
        font-size: 1.45rem;
      }

      #index .tile small {
        font-size: 0.85rem;
      }

      #index .intro {
        font-size: 1.3rem;
      }
    </style>
  </head>
  <body>
    <section class="slide" id="index">
      <span class="kicker">AI/ML · ML algorithms</span>
      <h1>Generalised Linear Models</h1>
      <p class="intro">Linear regression, logistic regression and their relatives: one family of models. Decks for this chapter are being written.</p>
      <div class="group">
        <div class="tiles">
          <div class="tile" style="opacity: 0.45"><span>Linear Regression<small>coming soon</small></span></div>
          <div class="tile" style="opacity: 0.45"><span>Logistic Regression<small>coming soon</small></span></div>
        </div>
      </div>
    </section>
  </body>
</html>
