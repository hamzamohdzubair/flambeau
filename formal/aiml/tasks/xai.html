<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Explainable AI</title>
    <link rel="stylesheet" href="/deck/deck.css" />
    <script src="/deck/deck.js" defer></script>
    <style>
      #box svg {
        width: min(100%, 60rem);
        height: auto;
        overflow: visible;
      }

      #box text {
        font-family: var(--font);
        font-size: 18px;
        fill: var(--text);
        text-anchor: middle;
        dominant-baseline: middle;
      }

      #box .io {
        fill: rgba(139, 92, 246, 0.16);
        stroke: rgba(167, 139, 250, 0.6);
      }

      #box .shell {
        fill: #0b0d1a;
        stroke: var(--violet-soft);
        stroke-width: 3;
      }

      #box .q {
        font-family: var(--font-display);
        font-size: 64px;
        fill: var(--faint);
      }

      #box .flow {
        stroke: var(--faint);
        stroke-width: 2.5;
        fill: none;
      }

      #box .why {
        font-family: var(--font-display);
        font-size: 22px;
        fill: #f9a8d4;
      }

      #box .inside line {
        stroke: var(--cyan);
        stroke-width: 2;
      }

      #box .inside rect {
        fill: rgba(34, 211, 238, 0.14);
        stroke: var(--cyan);
      }

      #box .inside text {
        font-size: 14px;
      }

      #box .pulse {
        fill: var(--pink);
      }

      .figs.white img {
        background: #fff;
      }

      #book img {
        max-height: 56vh;
      }
    </style>
  </head>
  <body>
    <section class="slide cover" id="title">
      <span class="kicker">AI/ML · Extra topics</span>
      <h1>Explainable AI</h1>
      <p>A model gives an answer. XAI asks: why that answer?</p>
    </section>

    <section class="slide" id="box">
      <h2>Black box or glass box?</h2>
      <svg viewBox="0 0 900 320" aria-label="An applicant goes into a model, which outputs 'loan denied'; opening the box shows the rules that led there">
        <rect class="io" x="10" y="125" width="170" height="70" rx="14" />
        <text x="95" y="160">Applicant</text>
        <path class="flow" d="M 185 160 L 300 160" />
        <rect class="shell" x="305" y="40" width="290" height="240" rx="24" />
        <text class="q" x="450" y="164">?</text>
        <g class="inside" opacity="0">
          <rect x="385" y="62" width="130" height="40" rx="10" />
          <text x="450" y="82">income &lt; 30k?</text>
          <line x1="420" y1="102" x2="370" y2="160" />
          <line x1="480" y1="102" x2="530" y2="160" />
          <text x="378" y="128" style="fill: var(--muted)">yes</text>
          <text x="522" y="128" style="fill: var(--muted)">no</text>
          <rect x="320" y="160" width="110" height="40" rx="10" />
          <text x="375" y="180">deny</text>
          <rect x="470" y="160" width="110" height="40" rx="10" />
          <text x="525" y="180">debt &gt; 50%?</text>
          <text x="450" y="245" style="fill: var(--muted); font-size: 13px">(an illustrative model)</text>
        </g>
        <path class="flow" d="M 600 160 L 715 160" />
        <rect class="io" x="720" y="125" width="170" height="70" rx="14" />
        <text x="805" y="160">Loan denied</text>
        <circle class="pulse" r="8" cx="185" cy="160" opacity="0" />
        <text class="why" x="805" y="235" opacity="0">Why?</text>
      </svg>
      <p class="center step" data-step="1">Most models only give the answer. "Why?" has no reply.</p>
      <p class="center step" data-step="2">Explainable AI opens the box: which inputs, and which rules, led to this output.</p>
    </section>

    <section class="slide">
      <h2>Interpretability vs explainability</h2>
      <figure class="step white">
        <img src="/assets/2025-10-09-08-07-04.png" alt="Table: interpretability is the level of understanding how the underlying AI technology works; explainability is the level of understanding how the AI-based system came up with a given result (ISO/IEC TR 29119-11:2020)" style="background: #fff" />
        <figcaption>Source: <a href="https://en.wikipedia.org/wiki/Explainable_artificial_intelligence">en.wikipedia.org/wiki/Explainable_artificial_intelligence</a></figcaption>
      </figure>
    </section>

    <section class="slide" id="book">
      <h2>Resources</h2>
      <figure class="step">
        <img src="/assets/2025-10-09-11-27-46.png" alt="Book cover: Interpretable Machine Learning by Christoph Molnar, third edition" />
        <figcaption>Free access: <a href="https://christophm.github.io/interpretable-ml-book/">christophm.github.io/interpretable-ml-book</a></figcaption>
      </figure>
    </section>

    <script type="module">
      const gsap = await Deck.load("gsap");

      Deck.scene("#title", {
        enter(slide) {
          gsap.from(slide.querySelectorAll(".kicker, h1, p"), { y: 30, opacity: 0, stagger: 0.12, duration: 0.8, ease: "power3.out" });
        },
      });

      const slide = document.querySelector("#box");
      const pulse = slide.querySelector(".pulse");
      const q = slide.querySelector(".q");
      const inside = slide.querySelector(".inside");
      const shell = slide.querySelector(".shell");
      const why = slide.querySelector(".why");
      let loop = null;
      function show(n, animate) {
        const d = animate ? 0.8 : 0;
        gsap.to(why, { opacity: n >= 1 ? 1 : 0, duration: d });
        gsap.to(q, { opacity: n >= 2 ? 0 : 1, duration: d });
        gsap.to(inside, { opacity: n >= 2 ? 1 : 0, duration: d, delay: n >= 2 ? d * 0.4 : 0 });
        gsap.to(shell, { attr: { fill: n >= 2 ? "rgba(34,211,238,0.06)" : "#0b0d1a" }, duration: d });
      }
      Deck.scene("#box", {
        enter() {
          show(Deck.step, false);
          // An applicant flows through the model, over and over
          loop = gsap.timeline({ repeat: -1, repeatDelay: 0.4 });
          loop.set(pulse, { attr: { cx: 185 }, opacity: 1 })
            .to(pulse, { attr: { cx: 300 }, duration: 0.6, ease: "none" })
            .to(pulse, { opacity: 0, duration: 0.15 })
            .set(pulse, { attr: { cx: 600 } }, "+=0.6")
            .to(pulse, { opacity: 1, duration: 0.15 })
            .to(pulse, { attr: { cx: 715 }, duration: 0.6, ease: "none" })
            .to(pulse, { opacity: 0, duration: 0.2 });
        },
        leave: () => loop?.kill(),
        step: (s, n, e, d) => show(n, d.dir > 0),
        unstep: (s, n) => show(n - 1, false),
      });
    </script>
  </body>
</html>
