<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Programming</title>
    <link rel="stylesheet" href="/deck/deck.css" />
    <script src="/deck/deck.js" defer></script>
    <style>
      .hub {
        gap: 1.6rem;
      }

      .hub .kicker {
        font-family: var(--font-mono);
        font-size: 0.8rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--cyan);
      }

      .hub h1 {
        text-align: center;
      }

      .hub > p.muted {
        max-width: 40rem;
        text-align: center;
      }

      .hub .group {
        display: grid;
        gap: 0.7rem;
        width: min(100%, 64rem);
      }

      .hub .group h3 {
        font-size: 1.15rem;
        color: var(--text);
      }

      .hub .group h3 span {
        margin-right: 0.5rem;
        font-family: var(--font-mono);
        font-size: 0.75rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--violet-soft);
      }

      .hub .tile {
        min-height: 5.6rem;
      }

      .hub .tiles.big .tile {
        min-height: 9rem;
        font-size: 1.3rem;
      }

      .hub .soon {
        opacity: 0.45;
      }

      /* Fixed 16:9 canvas: big tiles, centred row by row */
      .hub h1 {
        font-size: 4.2rem;
      }

      .hub > p.muted {
        font-size: 1.3rem;
      }

      .hub-cover .contents {
        gap: 0.8rem;
      }

      .hub-cover .contents .pill {
        font-size: 1.15rem;
      }

      .hub .group {
        width: 100%;
        justify-items: center;
      }

      .hub .group h3 {
        font-size: 1.3rem;
      }

      .hub .tiles {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 1.2rem;
        width: 100%;
      }

      .hub .tile,
      .slide.hub-group .tile {
        flex: 0 0 12.8rem;
        min-height: 9rem;
        font-size: 1.2rem;
      }

      .hub .tile small {
        font-size: 0.85rem;
      }

      .hub .tiles.big .tile {
        flex-basis: 18rem;
        min-height: 11rem;
        font-size: 1.6rem;
      }

      .hub .tiles.big:has(> :nth-child(4)) .tile {
        flex-basis: 12.8rem;
        min-height: 9rem;
        font-size: 1.4rem;
      }

      .slide.hub-group .tiles:has(> :nth-child(9)) .tile {
        flex-basis: 10.2rem;
        min-height: 7.5rem;
        font-size: 1.05rem;
      }

      .slide.hub-group .tiles:not(:has(> :nth-child(5))) .tile {
        min-height: 11.5rem;
      }

      .slide.hub-group .tiles:not(:has(> :nth-child(3))) .tile {
        flex-basis: 18rem;
        font-size: 1.5rem;
      }
    </style>
  </head>
  <body>
    <section class="slide hub hub-cover hub" id="hub">
      <span class="kicker">Computer science</span>
      <h1>Programming</h1>
      <nav class="contents">
        <a class="pill" href="#2">Concepts</a>
        <a class="pill" href="#3">Languages</a>
      </nav>
    </section>

    <section class="slide hub-group hub">
      <h2>Concepts</h2>
      <div class="tiles">
          <a class="tile" href="why-programming.html"><span>Why We Need Programming</span></a>
          <a class="tile" href="highvslow.html"><span>High Level vs Low Level</span></a>
        </div>
    </section>

    <section class="slide hub-group hub">
      <h2>Languages</h2>
      <div class="tiles">
          <a class="tile" href="cpp/index.html" style="--img:url('/assets/2025-10-02-11-55-50.png')"><span>C++</span></a>
          <a class="tile" href="python/index.html" style="--img:url('/assets/2025-10-19-00-50-48.png')"><span>Python</span></a>
          <a class="tile" href="rust/index.html" style="--img:url('/assets/2025-10-19-00-52-23.png')"><span>Rust</span></a>
          <div class="tile soon" style="--img:url('/assets/2025-10-02-11-56-23.png')"><span>Haskell<small>coming soon</small></span></div>
          <div class="tile soon" style="--img:url('/assets/2025-10-19-01-03-25.png')"><span>JavaScript<small>coming soon</small></span></div>
          <a class="tile" href="sql/index.html" style="--img:url('/assets/2025-10-19-00-55-48.png')"><span>SQL</span></a>
        </div>
    </section>
  </body>
</html>
