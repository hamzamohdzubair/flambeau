<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Probability &amp; Statistics</title>
    <link rel="stylesheet" href="/deck/deck.css" />
    <script src="/deck/deck.js" defer></script>
    <style>
      .hub {
        gap: 1.6rem;
      }

      .hub .kicker {
        font-family: var(--font-mono);
        font-size: 0.8rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--cyan);
      }

      .hub h1 {
        text-align: center;
      }

      .hub > p.muted {
        max-width: 40rem;
        text-align: center;
      }

      .hub .group {
        display: grid;
        gap: 0.7rem;
        width: min(100%, 64rem);
      }

      .hub .group h3 {
        font-size: 1.15rem;
        color: var(--text);
      }

      .hub .group h3 span {
        margin-right: 0.5rem;
        font-family: var(--font-mono);
        font-size: 0.75rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--violet-soft);
      }

      .hub .tile {
        min-height: 5.6rem;
      }

      .hub .tiles.big .tile {
        min-height: 9rem;
        font-size: 1.3rem;
      }

      .hub .soon {
        opacity: 0.45;
      }
    </style>
  </head>
  <body>
    <section class="slide top hub" id="hub">
      <span class="kicker">Mathematics</span>
      <h1>Probability &amp; Statistics</h1>

      <div class="group">
        <div class="tiles big">
          <div class="tile soon" style="--img:url('/assets/2025-10-02-12-14-59.png')"><span>Bayes Theorem<small>coming soon</small></span></div>
          <a class="tile" href="dist/index.html" style="--img:url('/assets/2025-09-30-23-22-15.png')"><span>Distribution Theory</span></a>
        </div>
      </div>
    </section>

    <section class="slide">
      <h2>Contents</h2>
      <ol>
        <li class="step">Terminology</li>
        <li class="step">Conditional probability</li>
      </ol>
      <p class="muted center step">These two chapters are still being written.</p>
    </section>
  </body>
</html>
