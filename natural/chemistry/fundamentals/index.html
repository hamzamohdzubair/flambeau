<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chemistry Fundamentals</title>
    <link rel="stylesheet" href="/deck/deck.css" />
    <script src="/deck/deck.js" defer></script>
    <style>
      .hub {
        gap: 1.6rem;
      }

      .hub .kicker {
        font-family: var(--font-mono);
        font-size: 0.8rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--cyan);
      }

      .hub h1 {
        text-align: center;
      }

      .hub > p.muted {
        max-width: 40rem;
        text-align: center;
      }

      .hub .group {
        display: grid;
        gap: 0.7rem;
        width: min(100%, 64rem);
      }

      .hub .group h3 {
        font-size: 1.15rem;
        color: var(--text);
      }

      .hub .group h3 span {
        margin-right: 0.5rem;
        font-family: var(--font-mono);
        font-size: 0.75rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--violet-soft);
      }

      .hub .tile {
        min-height: 5.6rem;
      }

      .hub .tiles.big .tile {
        min-height: 9rem;
        font-size: 1.3rem;
      }

      .hub .soon {
        opacity: 0.45;
      }
    </style>
  </head>
  <body>
    <section class="slide top hub" id="hub">
      <span class="kicker">Chemistry</span>
      <h1>Chemistry Fundamentals</h1>

      <div class="group">
        <h3>Atomic structure</h3>
        <div class="tiles">
          <a class="tile" href="atoms.html"><span>Atoms<small>Protons, neutrons, electrons, ions</small></span></a>
          <div class="tile soon"><span>Subatomic Particles<small>coming soon</small></span></div>
          <div class="tile soon"><span>Atomic Number &amp; Mass<small>coming soon</small></span></div>
          <div class="tile soon"><span>Isotopes<small>coming soon</small></span></div>
          <div class="tile soon"><span>Electron Configuration<small>coming soon</small></span></div>
          <div class="tile soon"><span>Periodic Table<small>coming soon</small></span></div>
        </div>
      </div>
    </section>
  </body>
</html>
