<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>No Dot Ordered List</title>
    <style>
      ol {
        list-style: none;
        counter-reset: item;
        padding-left: 1.5em;
      }
      ol li {
        counter-increment: item;
      }
      ol li::marker {
        content: counter(item) " ";
        width: 1.5em;
        display: inline-block;
        text-align: right;
      }
    </style>
  </head>
  <body>
    <ol>
      <li>First item</li>
      <li>Second item</li>
      <li>Third item</li>
    </ol>
  </body>
</html>
